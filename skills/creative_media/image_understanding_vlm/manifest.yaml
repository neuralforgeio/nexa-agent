name: image_understanding_vlm
version: 0.1.0
description: 'Understand an image from a workspace path or URL using a vision-language model: answer questions,
  detect objects, and extract visible text (OCR).'
category: creative_media
author: openforge
permissions:
- filesystem:workspace
- network:*
input_schema:
  anyOf:
  - type: object
    required:
    - image_path
    - questions
    properties:
      image_path: &id001
        type: string
      image_url: *id001
      questions:
        type: array
        items: *id001
        minItems: 1
  - type: object
    required:
    - image_url
    - questions
    properties:
      image_path: *id001
      image_url: *id001
      questions:
        type: array
        items: *id001
        minItems: 1
output_schema:
  type: object
  required:
  - answers
  properties:
    answers:
      type: array
      items:
        type: object
        properties:
          question: *id001
          answer: *id001
          confidence:
            type: number
            minimum: 0.0
            maximum: 1.0
        required:
        - question
        - answer
    detected_objects:
      type: array
      items: *id001
    extracted_text: *id001
examples:
- input:
    image_url: https://example.com/arch.png
    questions:
    - What components does this diagram show?
tags:
- vision
- creative-media
- vlm
