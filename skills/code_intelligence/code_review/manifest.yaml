name: code_review
version: 0.1.0
description: Review a workspace file for bugs, security issues, and style violations. Returns structured findings
  with severities and concrete suggestions plus a summary.
category: code_intelligence
author: nexa-agent
permissions:
- filesystem:workspace
- memory:read
- memory:write
input_schema:
  type: object
  required:
  - file_path
  properties:
    file_path: &id001
      type: string
    focus:
      type: string
      enum:
      - bugs
      - security
      - style
      - all
      default: all
output_schema:
  type: object
  required:
  - issues
  - summary
  properties:
    issues:
      type: array
      items:
        type: object
        properties:
          severity: *id001
          line:
            type: integer
          message: *id001
          suggestion: *id001
        required:
        - severity
        - line
        - message
        - suggestion
    summary: *id001
examples:
- input:
    file_path: agent/core/orchestrator.py
    focus: all
tags:
- code-review
- code-intelligence
- static-analysis
