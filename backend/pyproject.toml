[project]
name = "nexa-agent"
version = "1.0.0"
description = "Nexa Agent - The advanced AI agent by Dearly Febriano Irwansyah"
authors = [{ name = "Dearly Febriano Irwansyah" }]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "openai>=1.50.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.9.0",
    "websockets>=13.0",
]

[project.scripts]
nexa = "nexa.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexa"]
