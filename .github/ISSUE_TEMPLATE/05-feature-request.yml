name: ✨ Feature Request
description: Propose a new feature or capability
title: "[FEATURE] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please verify this hasn't already been requested.

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New tool for the agent
        - New LLM provider
        - Gateway (Telegram / Discord / Email / Webhook / ...)
        - Orchestrator / persona
        - Intelligence mesh (memory, reasoning, planning)
        - Web UI
        - TUI / CLI
        - Observability (logging, metrics, audit)
        - Security / permissions
        - Documentation / onboarding
        - Distribution / installer
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority (from your perspective)
      options:
        - Must-have (blocks adoption)
        - Should-have (significant value)
        - Nice-to-have (improves UX)
        - Polish
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What can't users do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: How should this work, step by step?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you tried to solve the same problem.
    validations:
      required: false

  - type: textarea
    id: use_cases
    attributes:
      label: Use cases (one per bullet)
      placeholder: |
        - As a developer, I want to ... so that ...
        - When X happens, the agent should ... so the user sees ...
        - On mobile, the flow should ... because ...
    validations:
      required: true

  - type: dropdown
    id: contribution
    attributes:
      label: Contribution offer
      options:
        - I can implement this (will open a PR)
        - I can review or test
        - I'm just sharing the idea
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I have searched open feature requests first
          required: true
        - label: This is not on the public roadmap yet
          required: true
        - label: I have described a real use case
          required: true
