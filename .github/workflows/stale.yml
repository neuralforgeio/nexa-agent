name: Stale Management

on:
  schedule: [cron: "0 5 * * *"]
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: "This has been inactive. If it is still relevant, please comment."
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-pr-message: "This PR has been inactive. Rebase or close."
          days-before-pr-stale: 21
          operations-per-run: 100
