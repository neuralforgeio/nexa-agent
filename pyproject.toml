[project]
name = "openforge"
version = "5.2.0"
description = "OpenForge — Forge intelligent code, locally."
authors = [{ name = "Dearly Febriano Irwansyah" }]
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai>=1.50.0",
    "prompt_toolkit>=3.0.0",
    "rich>=13.0.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0",
    "tenacity>=9.0.0",
    "httpx>=0.27.0",
    # v4.1.2: explicit deps that server.py, tools, and CLI modules already
    # import. Declared here so a fresh `pip install -e .` produces a working
    # install (previously these were transitive-only).
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "watchdog>=6.0.0",
    # v4.7.0 (F-11): /api/upload endpoint uses multipart/form-data.
    "python-multipart>=0.0.9",
    # v4.8.0 (B-06): per-endpoint rate limiting.
    "slowapi>=0.1.9",
    # v4.9.0 (Category 3): MCP + RAG + multimodal readers.
    "pypdf>=6.15.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "sqlite-vec>=0.1.6",
    "mcp>=1.0",
    # v4.6.1: spreadsheet_operations skill needs a real .xlsx backend.
    # Without this, a fresh install hits SkillError("requires openpyxl").
    "openpyxl>=3.1.0",
]

[project.scripts]
openforge = "openforge_cli.main:main"
openforge-chat = "src.cli:main"
openforge-agent = "src.run_agent:main"
openforge-gateway = "src.server:main"
openforge-tui = "ui_tui.app:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-timeout>=2.3", "pytest-xdist>=3.6"]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
    "timeout(seconds): per-test wall clock ceiling (pytest-timeout)",
    "llamacpp: needs a live llama.cpp server on 127.0.0.1:8080",
    "slow: tests slow enough to want filtering on CI",
]

[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["openforge*", "agent*", "tools*", "providers*", "openforge_cli*", "ui_tui*", "src*", "skills*", "nexa*"]
